<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WebAR — Задание 3: MindAR Face Tracking</title>

  <script src="aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
    a-scene { width: 100vw; height: 100vh; }
    video { z-index: 1 !important; }
    canvas { z-index: 2 !important; }
  </style>
</head>
<body>
  <a-scene
    mindar-face="filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 10"
    embedded
    color-space="sRGB"
    renderer="alpha: true; colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="15000">
      <a-asset-item id="glasses" src="models/glasses.glb"></a-asset-item>
    </a-assets>

    <a-camera active="false" position="0 0 0"></a-camera>

    <a-entity mindar-face-target="anchorIndex: 1">
      <a-gltf-model
        src="#glasses"
        rotation="0 0 0"
        adaptive-glasses>
      </a-gltf-model>
    </a-entity>

    <a-entity light="type: ambient; color: #BBB"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="1 2 1"></a-entity>
  </a-scene>

  <script>
    AFRAME.registerComponent('adaptive-glasses', {
      init: function () {
        const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        const desktopPos   = { x: 0, y: 0.22, z: 0 };
        const desktopScale = { x: 0.002, y: 0.002, z: 0.002 };

        const mobilePos   = { x: 0, y: -0.7, z: 0 };
        const mobileScale = { x: 0.002, y: 0.002, z: 0.002 };

        if (isMobile) {
          this.el.setAttribute('position', mobilePos);
          this.el.setAttribute('scale', mobileScale);
          console.log('[adaptive-glasses] Mobile values applied:', mobilePos, mobileScale);
        } else {
          this.el.setAttribute('position', desktopPos);
          this.el.setAttribute('scale', desktopScale);
          console.log('[adaptive-glasses] Desktop values applied:', desktopPos, desktopScale);
        }
      }
    });
  </script>
</body>
</html>
