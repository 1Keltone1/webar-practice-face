<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WebAR — Задание 3: MindAR Face Tracking</title>

  <script src="aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
    a-scene { width: 100vw; height: 100vh; }
    video { z-index: 1 !important; }
    canvas { z-index: 2 !important; }
  </style>
</head>
<body>
  <a-scene
    mindar-face
    embedded
    color-space="sRGB"
    renderer="alpha: true; colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- 1. Добавляем assets с моделью -->
    <a-assets timeout="15000">
      <a-asset-item id="jojo" src="models/glasses.glb"></a-asset-item>
    </a-assets>

    <a-camera active="false" position="0 0 0"></a-camera>

    <!-- 2. Заменяем a-sphere на a-gltf-model -->
    <a-entity mindar-face-target="anchorIndex: 1">
      <a-gltf-model
        src="#jojo"
        position="0 0.22 0"
        rotation="0 0 0"
        scale="0.002 0.002 0.002">
      </a-gltf-model>
    </a-entity>

    <a-entity light="type: ambient; color: #BBB"></a-entity>
    <a-entity light="type: directional; color: #FFF; intensity: 0.8" position="1 2 1"></a-entity>
  </a-scene>
</body>
</html>
